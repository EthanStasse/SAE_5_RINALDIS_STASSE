name: Livraison

# Livraison continue : construit les deux images de production et les publie
# sur le registre de GitHub (ghcr.io).
#   - à chaque fusion dans main : images étiquetées « main » et « sha-<commit> » ;
#   - à chaque tag de version (v0.1.0, v1.0.0...) : images étiquetées avec la
#     version et « latest ».
# main étant protégée, le code qui y arrive a déjà passé la CI et la relecture.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Deux livraisons du même endroit ne se chevauchent pas : la plus récente gagne.
concurrency:
  group: livraison-${{ github.ref }}
  cancel-in-progress: true

# Moindre privilège : lire le code, écrire uniquement dans le registre d'images.
permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest

    # Les deux images sont construites en parallèle depuis le même Dockerfile.
    strategy:
      matrix:
        include:
          - cible: production
            image: ghcr.io/ethanstasse/cocagne-app
          - cible: web
            image: ghcr.io/ethanstasse/cocagne-web

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Connexion au registre avec le jeton temporaire fourni par GitHub :
      # aucun secret à créer ni à stocker.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Étiquettes des images, calculées à partir de l'événement :
      #   fusion dans main → main, sha-abc1234 ;
      #   tag v0.1.0       → 0.1.0, 0.1, latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: Code
          target: ${{ matrix.cible }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache des couches Docker entre deux livraisons (une étendue par image).
          cache-from: type=gha,scope=${{ matrix.cible }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cible }}
