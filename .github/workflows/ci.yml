name: CI

# Sur une pull request : à chaque push dans la branche de la PR.
# Sur main : après chaque fusion (main est protégée, on n'y pousse jamais directement).
# Les branches sans PR ne lancent pas la CI : cela évite de la lancer deux fois
# (une pour le push, une pour la PR) sur la même modification.
on:
  push:
    branches: [main]
  pull_request:

# Si on pousse un nouveau commit alors que la CI tourne encore sur la même
# branche, l'exécution précédente est annulée : seul le dernier état compte.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cocagne_test
          POSTGRES_USER: cocagne
          POSTGRES_PASSWORD: cocagne
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # L'application Laravel est dans le sous-dossier Code/ du dépôt.
    defaults:
      run:
        working-directory: Code

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: cocagne_test
      DB_USERNAME: cocagne
      DB_PASSWORD: cocagne

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, zip, bcmath
          coverage: none

      # Cache de composer : les paquets téléchargés sont gardés d'une exécution
      # à l'autre. La clé dépend de composer.lock : si le lock change, le cache
      # est reconstruit ; sinon, composer install ne télécharge plus rien.
      - name: Dossier du cache composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('Code/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configuration
        run: cp .env.example .env && php artisan key:generate

      - name: Style (Pint)
        run: vendor/bin/pint --test

      - name: Analyse statique (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests (Pest, sur PostgreSQL)
        run: vendor/bin/pest

      - name: Audit des dépendances
        run: composer audit

  # Tests unitaires de la passerelle du Raspberry Pi (materiel/passerelle).
  # Job séparé : il tourne en parallèle du job Laravel, et un échec côté
  # matériel se voit tout de suite, sans être mélangé aux tests PHP.
  passerelle:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: materiel/passerelle

    steps:
      - uses: actions/checkout@v4

      # Python 3.11 : la version de Raspberry Pi OS (Bookworm), celle qui
      # exécutera vraiment la passerelle, et la première qui fournit tomllib.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Outils de test
        run: python -m pip install pytest

      - name: Tests (pytest)
        run: python -m pytest tests -v

  # Compilation du front (Vite + Tailwind) dans Code/.
  # Vérifie que le CSS et le JavaScript compilent avant la fusion :
  # une erreur de syntaxe CSS ou une dépendance npm cassée se voit ici.
  front:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Code

    steps:
      - uses: actions/checkout@v4

      # Node 22 : même version que le service node de docker-compose.yml,
      # et compatible avec Vite 8 (Node 20.19 ou 22.12 minimum).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache npm intégré à setup-node, indexé sur package-lock.json.
          cache: npm
          cache-dependency-path: Code/package-lock.json

      # npm ci installe exactement les versions de package-lock.json
      # (installation reproductible) et échoue si le lock n'est pas à jour.
      - name: Dépendances
        run: npm ci

      - name: Compilation (Vite)
        run: npm run build

      - name: Vérifie le manifeste Vite
        run: test -f public/build/manifest.json
