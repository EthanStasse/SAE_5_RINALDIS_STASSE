services:
  app:
    build: docker/php
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  # Tâches planifiées (surveillance des serres chaque minute, EF-C-09/10).
  scheduler:
    build: docker/php
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cocagne
      POSTGRES_USER: cocagne
      POSTGRES_PASSWORD: cocagne
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocagne -d cocagne"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  # Compile le CSS Tailwind et le JavaScript (Vite). Outil ponctuel : il ne
  # démarre pas avec « up -d ». Usage : docker compose run --rm node npm run build
  node:
    image: node:22-alpine
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /var/www/html
    environment:
      npm_config_cache: /tmp/.npm
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    profiles: ["outils"]

volumes:
  pgdata:
  vendor:
  node_modules:
