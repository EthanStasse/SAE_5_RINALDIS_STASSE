; Opcache en production : le code PHP compilé reste en mémoire.
; Le code ne change jamais dans une image : inutile de vérifier les fichiers
; à chaque requête (validate_timestamps=0). Une nouvelle version = une nouvelle image.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
