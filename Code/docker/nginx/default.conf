server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # Ne pas annoncer la version de nginx (en-tête Server, pages d'erreur).
    server_tokens off;

    # Les en-têtes de sécurité (CSP, X-Frame-Options, nosniff, HSTS...) sont posés
    # par Laravel (App\Http\Middleware\EntetesSecurite), testés par Pest.
    # Ne pas les redéclarer ici : des valeurs en double peuvent être ignorées.

    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}