# nginx en production : sert les fichiers de public/ et transmet le PHP à
# PHP-FPM (service « app »). Le HTTPS est géré par Caddy, placé devant.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Ne pas annoncer la version de nginx.
    server_tokens off;

    # Les en-têtes de sécurité sont posés par Laravel (EntetesSecurite).

    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fichiers compilés par Vite : leur nom contient une empreinte, ils ne
    # changent jamais, le navigateur peut les garder un an.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

        # DNS interne de Docker : l'adresse de « app » est redemandée toutes les
    # 10 s, car elle change quand le conteneur est recréé (nouveau déploiement).
    resolver 127.0.0.11 valid=10s;

    location ~ \.php$ {
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
